[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[deploy.beforeStartCommand]]
command = "npx prisma migrate resolve --rolled-back 20260219000000_add_profile_fields || true && npx prisma db push --skip-generate && npx prisma db seed"
